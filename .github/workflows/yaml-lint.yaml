---
name: yamllint
"on":
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
jobs:
  yamllint:
    runs-on: ubuntu-latest
    steps:
      # actions/checkout@v4.4.0
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Lint YAML files
        run: yamllint .
