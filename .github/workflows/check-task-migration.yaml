name: Check task migrations
"on":
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        # actions/checkout@v4.4.0
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - name: Create k8s Kind Cluster
        # helm/kind-action@v1.12.0
        uses: helm/kind-action@a1b0e391336a6ee6713a0583f8c6240d70863de3
        with:
          cluster_name: kind
      # tektoncd/actions/setup-tektoncd@main
      - uses: tektoncd/actions/setup-tektoncd@2b126ef971bbfda195d8a6c9b7c4eb3bfda452bf
        with:
          pipeline_version: latest
      - name: Run check
        run: |
          DEBIAN_FRONTEND=noninteractive \
          sudo apt-get install -y --no-install-recommends \
              tzdata python3-ruamel.yaml

          kubectl get all -n tekton-pipelines
          # Require name main
          git branch main origin/main
          # Make `git branch --show-current` works.
          git checkout -b pr-verify
          export IN_CLUSTER=1
          bash ./hack/validate-migration.sh
